appId: com.changyi.novel
productName: 长忆
directories:
  output: ../release-desktop
files:
  - main.cjs
  - preload.cjs
  - storage-manager.cjs
  - setup.html
  - setup.js
  - splash.html
  - app-icon-v2.ico
  - app-icon-v2.png
  - package.json
  - '!**/*.map'
  - '!**/query_engine-*.tmp*'
asar: true
electronLanguages:
  - zh-CN
  - en-US
afterPack: ./after-pack.cjs
asarUnpack:
  - node_modules/**
extraResources:
  - from: ../.desktop-build/standalone
    to: standalone
  - from: ../.desktop-build/prisma
    to: prisma
  - from: ../.desktop-build/prisma-cli/node_modules
    to: app.asar.unpacked/node_modules
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: app-icon-v2.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
