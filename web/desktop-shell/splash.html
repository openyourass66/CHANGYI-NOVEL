<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>长忆</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f9fc; color: #202637; }
      main { width: min(360px, 90vw); text-align: center; }
      .mark { width: 52px; height: 52px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 16px; background: #e9eefe; color: #465bc5; font-size: 25px; }
      h1 { margin: 0; font-size: 21px; font-weight: 650; letter-spacing: .02em; }
      p { margin: 10px 0 24px; color: #737b8d; font-size: 13px; }
      .track { height: 3px; overflow: hidden; border-radius: 4px; background: #e4e7ef; }
      .track::after { content: ""; display: block; width: 36%; height: 100%; border-radius: inherit; background: #596bd1; animation: load 1.2s ease-in-out infinite alternate; }
      @keyframes load { from { transform: translateX(-15%); } to { transform: translateX(205%); } }
      @media (prefers-color-scheme: dark) { body { background: #131722; color: #eef0f8; } .mark { background: #262e4b; color: #aab5ff; } p { color: #a4aabc; } .track { background: #303646; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">长</div>
      <h1>长忆小说工作台</h1>
      <p>正在启动本机工作区…</p>
      <div class="track" role="progressbar" aria-label="正在启动"></div>
    </main>
  </body>
</html>
